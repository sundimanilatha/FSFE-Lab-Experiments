<!DOCTYPE html>
<html>
<head>
<title>CSS Theme and Dark Mode</title>
<style>
body {
  background: white;
  color: black;
  text-align: center;
  font-family: Arial;
  transition: 0.5s;
}
h2 {
  animation: move 2s infinite alternate;
}
@keyframes move {
  from { 
transform: translateY(0); 
}
  to { 
transform: translateY(10px);
 }
}
.dark {
  background: black;
  color: white;
}
</style>
</head>
<body>
<h2>Modern CSS</h2>
<p>Welcome to Dark Mode!</p>
<button onclick="document.body.classList.toggle('dark')">
  Change Theme
</button>

</body>
</html>
